<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-height portrait canvas column. Score and pet float on top, one-tap game below, overlays for menu and game over. */
:root{
  --bg:#0f1233; --fg:#f6f3ff; --muted:#b4b0e0; --accent:#ffd24a; --accent-d:#c9951a;
  --good:#3ee0b0; --bad:#ff5c7a; --line:rgba(255,255,255,.14);
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:600;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);touch-action:none;background:#14213d}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
.hud>*{flex:1;min-width:0}
.petbtn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left;pointer-events:auto;cursor:pointer}
.petbtn .pet{width:50px;height:50px;flex:none}
.petmeta{display:flex;flex-direction:column;gap:3px;min-width:0}
.petmeta b{font-family:var(--display);font-weight:600;font-size:12px;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.xp{width:78px;height:7px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.xp i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--good),var(--accent));transition:width .4s}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}
.mid strong{font-family:var(--display);font-weight:800;font-size:52px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.28),0 0 22px rgba(0,0,0,.25)}
.chip{font-family:var(--display);font-weight:600;font-size:12px;background:var(--accent);color:#2a1d00;padding:5px 11px;border-radius:99px;box-shadow:0 3px 0 var(--accent-d)}
.right{text-align:right;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-shadow:0 1px 6px rgba(0,0,0,.5);padding-top:6px}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));width:min(100%,480px);margin:0;text-align:center;font-size:15px;font-weight:800;padding:0 24px;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;z-index:5}
.hint:not(:empty){animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.toast{position:fixed;left:50%;top:calc(24% + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:8;background:var(--accent);color:#2a1d00;font-family:var(--display);font-weight:600;font-size:13px;padding:10px 16px;border-radius:14px;box-shadow:0 6px 0 var(--accent-d);animation:toast 2.4s forwards;white-space:nowrap;pointer-events:none;max-width:92vw}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(12,10,36,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{width:min(100%,400px);margin:auto;border-radius:28px;padding:22px 20px 20px;background:linear-gradient(180deg,#2b2766,#1c1948);border:2px solid var(--line);box-shadow:0 30px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo-wrap{display:flex;flex-direction:column;align-items:center}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(34px,12vw,54px);letter-spacing:.03em;line-height:1;background:linear-gradient(180deg,#ffe38a,#ff7a8a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.logo-r{transform:scaleY(-1);opacity:.32;-webkit-mask-image:linear-gradient(to top,#000,transparent 65%);mask-image:linear-gradient(to top,#000,transparent 65%);margin-top:.08em;margin-bottom:-.5em}
.sub{margin:0;color:var(--muted);font-size:14px;line-height:1.4;max-width:32ch}
.card .pet{width:104px;height:104px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--fg);font-weight:800}
.facts{display:flex;gap:10px;width:100%}
.facts div{flex:1;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;gap:2px}
.facts b{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.facts small{color:var(--muted);font-size:11px;font-weight:800}
.btn{width:100%;border:0;border-radius:18px;padding:14px 16px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;background:var(--accent);color:#2a1d00;box-shadow:0 5px 0 var(--accent-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
.btn.alt{background:rgba(255,255,255,.1);color:var(--fg);box-shadow:0 5px 0 rgba(0,0,0,.3);border:1.5px solid var(--line)}
.btn small{display:block;font-family:var(--body);font-weight:800;font-size:12px;opacity:.75;margin-top:3px}
.txtbtn{background:none;border:0;color:var(--muted);font-size:12px;font-weight:800;padding:4px;cursor:pointer}
.btn:focus-visible,.petbtn:focus-visible,.txtbtn:focus-visible{outline:3px solid #7ef0ff;outline-offset:2px}
.over-score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.badge-new{background:var(--accent);color:#2a1d00;font-family:var(--display);font-weight:600;font-size:12px;padding:6px 12px;border-radius:99px}
.share-box{width:100%;height:110px;border-radius:12px;border:1.5px solid var(--line);background:#12103a;color:var(--fg);padding:8px;font:700 13px/1.3 var(--body);resize:none;user-select:text;-webkit-user-select:text}
.msg{margin:0;font-size:13px;color:var(--good);min-height:16px;font-weight:800}
.pet{display:block}
.pet svg{width:100%;height:100%;overflow:visible}
.pet .blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pet.hop{animation:hop .55s}
@keyframes hop{30%{transform:translateY(-12px) scale(1.06,.96)}60%{transform:translateY(0) scale(.96,1.05)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.pet .blink,.pet.hop,.hint:not(:empty){animation:none}}

.zoo{max-width:420px;gap:10px;padding:16px 14px}
.zoo-head{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.zoo-head b{font-family:var(--display);font-weight:600;font-size:16px}
.zgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.zc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 10px;border-radius:16px;background:rgba(255,255,255,.07);border:2px solid var(--rc,var(--line));cursor:pointer;text-align:center;min-width:0}
.zc .pet{width:58px;height:58px}
.zc.locked .pet{filter:brightness(0) opacity(.5)}
.zc.sel{background:rgba(255,210,74,.16);box-shadow:0 0 0 2px var(--accent)}
.zn{font-family:var(--display);font-weight:600;font-size:10.5px;line-height:1.2;overflow-wrap:anywhere}
.zr{font-size:10px;font-weight:800;color:var(--rc)}
.zh{font-size:10.5px;line-height:1.25;color:var(--muted);font-weight:700}
.zp{display:block;width:88%;height:5px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.zp u{display:block;height:100%;background:var(--rc);text-decoration:none}
.za{font-size:10px;line-height:1.25;color:#ffe08a;font-weight:800}
.tasks{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.tk-h{font-family:var(--display);font-weight:600;font-size:12px;color:var(--muted)}
.tk{background:rgba(255,255,255,.08);border-radius:12px;padding:7px 10px;font-size:12px;font-weight:800;display:flex;flex-direction:column;gap:5px}
.tk.done{background:rgba(62,224,176,.18)}
.tk b{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.tk i{display:block;height:5px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.tk u{display:block;height:100%;background:var(--good);text-decoration:none}
.zc:focus-visible,#zooClose:focus-visible{outline:3px solid #7ef0ff;outline-offset:2px}
</style>

<div class="stage" id="stage"><canvas id="cv" aria-label="Игровое поле: тапни, чтобы прыгнуть"></canvas></div>

<div class="ov" id="over" hidden>

    <span class="pet" id="petOver" style="width:92px;height:92px"></span>

    <button class="btn alt" id="share">Поделиться результатом</button>
    <button class="btn alt" id="toMenu">В меню</button>
  </div>
</div>

<div class="ov" id="zoo" hidden>
  <div class="card zoo">
    <div class="zoo-head"><b id="zooTitle">Зверинец</b><button class="txtbtn" id="zooClose">Закрыть</button></div>
    <div class="zgrid" id="zgrid"></div>
    <p class="msg" id="zooMsg"></p>
    <textarea class="share-box" id="zooTxt" readonly hidden></textarea>
    <button class="btn alt" id="zooShare">Поделиться зверинцем</button>
  </div>
</div>

<script>
(function(){
'use strict';
//#LOGIC-START
var W=400,PSPEED=560,HOLE_K=26000,SUP=1.35,WIND_A=260,GRAV_K=16000;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function lerp(a,b,t){return a+(b-a)*t}
var WORLDS={calm:{n:'Космос'},wind:{n:'Ветреный океан',tip:'Ветер сносит прыжок: смотри на пунктир'},ice:{n:'Ледяное поле',tip:'Лёд: планеты крутятся рывками, лови момент'},grav:{n:'Глубокий космос',tip:'Планеты тянут к себе: пунктир изгибается'}};
function worldOf(seed,i){
  if(i<14)return'calm';
  var b=Math.floor((i-14)/16),prev='calm',w='calm',n,opts,r;
  for(n=0;n<=b;n++){
    r=mulberry32(hashStr(seed+':w:'+n))();
    opts=['wind','ice','grav'].filter(function(x){return x!==prev});
    w=opts[Math.floor(r*opts.length)];prev=w;
  }
  return w;
}
function genPlanet(seed,i,prev){
  var rng=mulberry32(hashStr(seed+':p:'+i));
  var k=Math.min(1,i/40);
  var r=lerp(50,28,k)*(0.92+rng()*0.16);
  var amp=i<5?0:Math.min(52,(i-4)*4);
  var ghost=i>0&&prev.kind==='bounce',after=i>1&&!!prev.ghost;
  var dy=i===0?0:(ghost?105+rng()*30:after?130+rng()*40:178+rng()*48);
  var bx=i===0?W/2:prev.bx+(rng()*2-1)*((ghost||after)?90:140);
  var lo=r+22+amp,hi=W-r-22-amp;
  bx=Math.max(lo,Math.min(hi,bx));
  var spin=(2.0+Math.min(i,44)*0.05+rng()*0.35)*(rng()<0.5?-1:1);
  var p={i:i,r:r,bx:bx,y:i===0?0:prev.y-dy,amp:amp,freq:0.6+rng()*0.5,ph:rng()*6.283,spin:spin,rotA:rng()*6.283,
    ci:Math.floor(rng()*6),
    craters:[[rng()*6.283,0.45+rng()*0.3,0.14+rng()*0.1],[rng()*6.283,0.3+rng()*0.4,0.1+rng()*0.1],[rng()*6.283,0.5+rng()*0.3,0.08+rng()*0.1]],
    gem:null,kind:'normal',ghost:ghost,rock:null,hole:null,comet:null};
  p.world=worldOf(seed,i);
  if(p.world==='wind'){var wr=mulberry32(hashStr(seed+':wd:'+i));p.wind=(wr()<.5?-1:1)*(.65+wr()*.35)}else p.wind=0;
  if(i>=2&&rng()<0.55){
    var side0=rng()<0.5?-1:1;
    p.gem={x:Math.max(30,Math.min(W-30,(prev.bx+bx)/2+side0*(42+rng()*30))),y:(prev.y+p.y)/2,taken:false,ph:rng()*6};
  }
  if(i>=3&&!ghost&&!after){
    var r2=mulberry32(hashStr(seed+':x:'+i));
    var h=r2(),hz=0;
    if(i>=6&&h<0.22)hz=1;else if(i>=10&&h<0.42)hz=2;
    var ldx=bx-prev.bx,ldy=p.y-prev.y,len=Math.hypot(ldx,ldy),ux=ldx/len,uy=ldy/len;
    var px=-uy,py=ux,mx=(prev.bx+bx)/2,my=(prev.y+p.y)/2,sd=mx<W/2?1:-1;
    if(hz===1){
      var rr=15+r2()*6,off=rr+30+r2()*16;
      p.rock={x:Math.max(rr,Math.min(W-rr,mx+px*sd*off)),y:my+py*sd*off,r:rr};
    }else if(hz===2){
      var off2=62+r2()*26;
      p.hole={x:Math.max(30,Math.min(W-30,mx+px*sd*off2)),y:my+py*sd*off2};
    }
    if(hz){p.gem=null;p.amp=Math.min(p.amp,18)}
    else if(i>=8&&r2()<0.12){p.comet={x:mx+(r2()*2-1)*14,y:my,taken:false,ph:r2()*6}}
    else if(r2()<Math.min(0.3,0.1+i*0.012)){p.kind='ice';p.spin=Math.sign(p.spin)*Math.min(5.5,Math.abs(p.spin)*1.35)}
  }
  if(ghost)p.gem=null;
  if(i>=6&&!ghost&&!after&&p.kind==='normal'&&!p.rock&&!p.hole&&!p.comet&&mulberry32(hashStr(seed+':b:'+i))()<0.13)p.kind='bounce';
  return p;
}
function planetX(p,t){return p.bx+p.amp*Math.sin(t*p.freq+p.ph)}
function spinMul(p,t){return p.world==='ice'?1+.6*Math.sin(t*1.9+p.i):1}
function flyStep(s,P,cur){
  var i,p,dx,dy,d,g,r,hi=Math.min(P.length,cur+6),sp=s.sp||PSPEED;
  s.t+=4/sp;
  for(i=cur;i<hi;i++){
    p=P[i];
    if(p.hole){
      dx=p.hole.x-s.x;dy=p.hole.y-s.y;d=Math.hypot(dx,dy);
      if(d<16)return{k:'die',c:'hz'};
      if(d<60)s.near=true;
      if(d<170){g=HOLE_K/Math.max(d,28)*(4/sp)/sp;s.dx+=dx/d*g;s.dy+=dy/d*g;d=Math.hypot(s.dx,s.dy);s.dx/=d;s.dy/=d}
    }
  }
  var Pc=P[cur];
  if(Pc&&Pc.world==='wind'){
    s.dx+=Pc.wind*(WIND_A*(s.wm||1)*(4/sp)/sp);d=Math.hypot(s.dx,s.dy);s.dx/=d;s.dy/=d;
  }else if(Pc&&Pc.world==='grav'){
    for(i=cur;i<hi;i++){
      p=P[i];if(p.ghost||(i===s.from&&s.dist<60))continue;
      dx=planetX(p,s.t)-s.x;dy=p.y-s.y;d=Math.hypot(dx,dy);
      if(d<200&&d>1){g=GRAV_K*(p.r/40)/Math.max(d,45)*(4/sp)/sp;s.dx+=dx/d*g;s.dy+=dy/d*g}
    }
    d=Math.hypot(s.dx,s.dy);s.dx/=d;s.dy/=d;
  }
  s.x+=s.dx*4;s.y+=s.dy*4;s.dist+=4;
  for(i=cur;i<hi;i++){
    r=P[i].rock;
    if(r){d=Math.hypot(s.x-r.x,s.y-r.y);if(d<r.r+10){if(s.ph&&(!s.phU||s.phR===r)){s.phU=true;s.phR=r;s.near=true}else return{k:'die',c:'hz'}}else if(d<r.r+24)s.near=true}
  }
  for(i=Math.max(0,cur-1);i<hi;i++){
    if(i===s.from&&s.dist<40)continue;
    p=P[i];if(p.ghost)continue;
    if(Math.hypot(s.x-planetX(p,s.t),s.y-p.y)<p.r+(s.sup?(s.pru?34:24):12)+(s.fr&&Pc&&Pc.world==='grav'?9:0))return{k:'land',i:i};
  }
  if(s.x<-30||s.x>W+30||s.dist>(s.sup?900:760))return{k:'die'};
  return null;
}
//#LOGIC-END

var $=function(id){return document.getElementById(id)};
var ICEC={b:'#7fd8ff',l:'#e9fbff'};

        e.fire-=dt;if(e.fire<=0){e.fire=1.9+r()*1.2;miniShot(m,e,Math.atan2(sh.x-e.x,sh.y-e.y),235)}
        if(e.ht>6.5){e.st='dive';e.vx=(sh.x-e.x)/1.3;e.vy=300}

      if(e.st==='enter'){e.y+=120*dt;if(e.y>=m.uiY+92){e.y=m.uiY+92;e.st='hover';e.ht=0}}
      else{

      }

      miniHurt(m);
      if(e.t==='a'){miniKill(m,e,true);m.en.splice(i,1)}
    }
  }
  // player bullets
  for(i=m.pb.length-1;i>=0;i--){
    b=m.pb[i];b.y+=b.vy*dt;
    if(b.y<-20){m.pb.splice(i,1);continue}

    var bx=100,bw=W-bx-20,left=Math.max(0,MINI_DUR-m.pt),fr=m.phase==='out'?(m.reason==='time'?0:left/MINI_DUR):left/MINI_DUR;

/* ---------- mini-game "Comet runner" ---------- */
var RUN={X0:96,GR:3200,V1:800,V2:700,PH:30};
function runInit(m){
  m.run={gy:Math.max(m.uiY+260,HL-170),pz:0,vz:0,jumps:0,air:false,buf:0,dist:0,vis:0,next:286,obs:[],gm:[],cleared:0,squash:0,v:250};
}
function runJump(){
  var m=G&&G.mini,R;if(!m||m.kind!=='run'||m.phase!=='play')return;
  R=m.run;
  if(!R.air){R.vz=RUN.V1;R.air=true;R.jumps=1;R.squash=0;sfxJump();buzz(6);burst(RUN.X0-6,R.gy,3,5,90)}
  else if(R.jumps<(has('zayac')?3:2)){R.vz=RUN.V2;R.jumps++;sfxJump();burst(RUN.X0,R.gy-R.pz,1,8,140)}
  else R.buf=.12;
}
function runSpawn(m){
  var R=m.run,r=m.rr,v=R.v,roll=r(),pt=m.pt,x=W+40,type,span,top,cx,k,u;
  if(pt>5&&roll<.2)type='drone';else if(pt>5&&roll<.42)type='pair';else if(pt>2&&roll<.64)type='spike';else type='rock';
  if(type==='rock'){R.obs.push({t:'rock',x:x,w:28,h:26,yb:0,ph:r()*6});span=28;top=26;cx=x}
  else if(type==='spike'){R.obs.push({t:'spike',x:x,w:22,h:46,yb:0,ph:0});span=22;top=46;cx=x}
  else if(type==='pair'){R.obs.push({t:'rock',x:x,w:28,h:26,yb:0,ph:r()*6});R.obs.push({t:'rock',x:x+56,w:28,h:26,yb:0,ph:r()*6});span=84;top=26;cx=x+28}
  else{R.obs.push({t:'drone',x:x,w:34,h:56,yb:48,ph:r()*6});span=34;top=0;cx=x}
  if(type==='drone'){for(k=-1;k<=1;k++)R.gm.push({x:cx+k*26,h:15})}
  else if(r()<.55){for(k=0;k<4;k++){u=(k-1.5)/1.5;R.gm.push({x:cx+(k-1.5)*(type==='pair'?30:24),h:top+20+26*(1-u*u)})}}
  R.next=R.dist+span+v*(.7+r()*.55)+(type==='pair'?40:0);
}
function updateRun(dt,m){
  var R=m.run,sh=m.ship,i,o,g,v=270+m.pt*6,px=RUN.X0;
  R.v=v;R.dist+=v*dt;R.vis+=v*dt;
  if(R.air){
    R.vz-=RUN.GR*dt;R.pz+=R.vz*dt;
    if(R.pz<=0){R.pz=0;R.vz=0;R.air=false;R.jumps=0;R.squash=.22;burst(px,R.gy,3,4,70);if(R.buf>0){R.buf=0;runJump()}}
  }
  if(R.buf>0)R.buf-=dt;
  if(R.squash>0)R.squash-=dt;
  if(sh.inv>0)sh.inv-=dt;
  sh.x=px;sh.y=R.gy-R.pz-17;
  if(R.dist>=R.next&&m.pt<21.5)runSpawn(m);
  for(i=R.obs.length-1;i>=0;i--){
    o=R.obs[i];o.x-=v*dt;
    if(o.x<-70){R.obs.splice(i,1);continue}
    if(sh.inv<=0&&Math.abs(o.x-px)<o.w/2+9&&R.pz<o.yb+o.h-4&&R.pz+RUN.PH>o.yb+4){
      burst(o.x,R.gy-o.yb-o.h/2,o.t==='drone'?5:1,12,220);R.obs.splice(i,1);
      miniHurt(m);if(m.phase==='out')return;continue;
    }
    if(!o.passed&&o.x+o.w/2<px-10){o.passed=true;R.cleared++;m.pts+=1;G.score+=1}
  }
  for(i=R.gm.length-1;i>=0;i--){
    g=R.gm[i];g.x-=v*dt;
    if(g.x<-30){R.gm.splice(i,1);continue}
    if(Math.abs(g.x-px)<20&&Math.abs(g.h-(R.pz+15))<24){
      R.gm.splice(i,1);m.pts+=1;G.score+=1;sfxGem();popups.push({x:g.x,y:R.gy-g.h-12,text:'+1',t0:G.time,gold:true});
    }
  }
  if(m.pt>=MINI_DUR&&m.phase==='play')endMini('time');
}

var last=performance.now();
function frame(t){
  var dt=Math.min(.033,(t-last)/1000);last=t;
  if(slowT>0){slowT-=dt;dt*=.4}
  if(zoomK>0)zoomK=Math.max(0,zoomK-dt*2.2);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue}
    p.vy+=420*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*6;
  }
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
  update(dt);draw(t);requestAnimationFrame(frame);
}

$('zooShare').addEventListener('click',function(){
  var own=0;CHARS.forEach(function(c){if(store.chars[c.id])own++});
  var txt='Орбита · зверинец '+own+'/'+CHARS.length+'\n'+CHARS.map(function(c){return store.chars[c.id]?c.emoji:'⬛'}).join(''),box=$('zooTxt'),msg=$('zooMsg');
  box.value=txt;
  function manual(){box.hidden=false;box.focus();box.select();msg.textContent='Скопируйте текст и отправьте друзьям'}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){msg.textContent='Скопировано. Покажи друзьям свой зверинец!'},manual)}
    else manual();
  }catch(err){manual()}
});

/* ---------- boot ---------- */
resize();renderPets();showMenu();hud();
requestAnimationFrame(frame);
})();
</script>
